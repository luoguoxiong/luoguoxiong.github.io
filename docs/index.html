<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>luoguoxiong Blog</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Description">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="//unpkg.com/docsify@4/lib/themes/vue.css">
</head>
<style>
    .app-name-link>img{
        border-radius: 50%;
        width: 150px;
    }
</style>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      logo: 'https://avatars.githubusercontent.com/u/26996446?v=4',
      name: 'luoguoxiong',
      sidebarDisplayLevel: 0, // set sidebar display level
      repo: 'https://github.com/luoguoxiong',
      loadSidebar: true,
    }
  </script>
  <!-- Docsify v4 -->
  <script src="//unpkg.com/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/zoom-image.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/docsify-sidebar-collapse.min.js"></script>
  <!-- Mermaid 流程图支持 -->
  <script src="//cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <script>
    window.$docsify = window.$docsify || {};
    window.$docsify.mermaidConfig = {
      startOnLoad: false,
      theme: 'default',
      securityLevel: 'loose',
      flowchart: { curve: 'basis', htmlLabels: false, useMaxWidth: true }
    };
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify-mermaid@2/dist/docsify-mermaid.min.js"></script>
  <!-- <script src="//cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script> -->
</body>
</html>
